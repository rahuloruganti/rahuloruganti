name: Update terminal card

on:
  schedule:
    - cron: "17 3 * * *" # daily refresh
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/gen_card.py
      - scripts/gen_extras.py
      - .github/workflows/card.yml

permissions:
  contents: write

concurrency:
  group: card
  cancel-in-progress: true

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate assets (card, langs, activity)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python scripts/gen_card.py
          python scripts/gen_extras.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || (git commit -m "chore: refresh profile assets" && git push)
